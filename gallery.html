<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Flickgames</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <script>
    (function () {
      try {
        if (window.FLICKGAME_HOST === 'ios-app' || window.FLICKGAME_IOS_APP) {
          document.documentElement.setAttribute('data-ios-app', 'true');
        }
      } catch (e) {}
    })();
  </script>
  <style>
    :root {
      --muted-foreground: #666;
      --panel-alt: #111;
      --text: #eee;
      --bg: #000;
    }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow-x: hidden;
    }
    .gallery-page-header {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: max(16px, env(safe-area-inset-top)) 16px 14px;
      border-bottom: 2px solid var(--muted-foreground);
      background: rgba(0, 0, 0, 0.96);
      backdrop-filter: blur(12px);
    }
    .gallery-page-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .gallery-page-title {
      margin: 0;
      min-width: 0;
      flex: 1 1 auto;
      font-size: 24px;
      font-weight: 700;
    }
    .gallery-supporter {
      display: none;
      flex: 0 0 auto;
      padding: 0;
      border: 0;
      background: none;
      color: #333;
    }
    .gallery-supporter svg {
      display: block;
      width: 28px;
      height: 28px;
    }
    html[data-ios-app="true"] .gallery-supporter {
      display: block;
    }
    html[data-supporter="true"] .gallery-supporter {
      color: #f4e585;
      pointer-events: none;
    }
    .gallery-page-body {
      padding: 16px;
      padding-bottom: max(24px, env(safe-area-inset-bottom));
    }
    .gallery-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    @media (min-width: 500px) {
      .gallery-grid {
        grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      }
    }
    .gallery-card {
      --bg: #000;
      --ink: #fff;
      background: var(--bg);
      color: var(--ink);
      border: 1px solid color-mix(in srgb, var(--ink) 22%, transparent);
      border-radius: 12px;
      padding: 8px;
      box-sizing: border-box;
      overflow: hidden;
      min-width: 0;
      position: relative;
    }
    .gallery-card.gallery-tile {
      background: #0a0a0a;
      color: #888;
      border: 1px dashed #444;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .gallery-thumb-wrap {
      position: relative;
      aspect-ratio: 16 / 10;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      border-radius: 6px;
      overflow: hidden;
      cursor: pointer;
    }
    .gallery-thumb-frame {
      max-width: 100%;
      max-height: 100%;
      border: 1px solid color-mix(in srgb, var(--ink) 40%, transparent);
      box-sizing: border-box;
      display: block;
    }
    .gallery-thumb {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }
    .gallery-x {
      position: absolute;
      top: 0;
      right: 0;
      width: 34px;
      height: 34px;
      border-radius: 0 0 0 12px;
      background: rgba(0, 0, 0, 0.55);
      color: #ff5c5c;
      border: none;
      font-size: 22px;
      font-weight: 700;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
    }
    .gallery-x::after {
      content: "";
      position: absolute;
      inset: -5px;
    }
    .gallery-title {
      font-size: 13px;
      font-weight: 600;
      margin-top: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--ink);
    }
    .gallery-time {
      font-size: 10px;
      margin-top: 2px;
      color: var(--ink);
      opacity: 0.65;
    }
    .gallery-actions {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 5px;
      margin-top: 7px;
    }
    .gallery-ibtn {
      aspect-ratio: 1 / 1;
      border-radius: 8px;
      border: 1px solid color-mix(in srgb, var(--ink) 30%, transparent);
      background: transparent;
      color: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
    }
    .gallery-ibtn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }
    /* Press feedback: shrink at once on touch-down, spring back on release. */
    .gallery-ibtn,
    .gallery-x,
    .gallery-thumb-wrap,
    .gallery-card.gallery-tile {
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.35s cubic-bezier(0.3, 1.6, 0.5, 1), opacity 0.2s ease-out;
    }
    .gallery-ibtn:active:not([disabled]),
    .gallery-x:active:not([disabled]) {
      transform: scale(0.82);
      opacity: 0.6;
      transition-duration: 0.06s;
    }
    .gallery-thumb-wrap:active,
    .gallery-card.gallery-tile:active {
      transform: scale(0.96);
      opacity: 0.8;
      transition-duration: 0.06s;
    }
    @media (prefers-reduced-motion: reduce) {
      .gallery-ibtn:active:not([disabled]),
      .gallery-x:active:not([disabled]),
      .gallery-thumb-wrap:active,
      .gallery-card.gallery-tile:active {
        transform: none;
      }
    }
    .gallery-ibtn[disabled],
    .gallery-x[disabled] {
      opacity: 0.45;
      cursor: default;
    }
    .gallery-tile-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .gallery-tile-plus {
      font-size: 48px;
      line-height: 1;
      font-weight: 700;
    }
    .gallery-btn {
      border: 2px solid var(--muted-foreground);
      background: var(--panel-alt);
      color: var(--text);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13px;
      cursor: pointer;
    }
    .gallery-btn[disabled] {
      opacity: 0.45;
      cursor: default;
    }
    .gallery-share-overlay {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(0, 0, 0, 0.7);
    }
    .gallery-share-overlay.visible {
      display: flex;
    }
    .gallery-share-sheet {
      width: min(420px, 100%);
      background: var(--panel-alt);
      border: 2px solid var(--muted-foreground);
      border-radius: 12px;
      padding: 12px;
      box-sizing: border-box;
    }
    .gallery-share-title {
      margin: 0 0 10px;
      font-size: 17px;
      font-weight: 700;
    }
    .gallery-share-sheet .gallery-btn {
      width: 100%;
      margin-bottom: 8px;
      text-align: left;
    }
    .gallery-toast {
      position: fixed;
      left: 50%;
      bottom: max(20px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 50;
      display: none;
      max-width: min(460px, calc(100vw - 24px));
      border: 1px solid var(--muted-foreground);
      border-radius: 999px;
      background: #1a1a1a;
      color: var(--text);
      padding: 10px 14px;
      font-size: 13px;
      text-align: center;
      box-sizing: border-box;
    }
    .gallery-toast.visible {
      display: block;
    }
    .gallery-page-header-row .gallery-ibtn {
      flex: 0 0 44px;
      width: 44px;
      border: 1px solid var(--muted-foreground);
      color: var(--text);
    }

    html[data-ios-app="true"] {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      height: 100%;
    }
    html[data-ios-app="true"] body {
      height: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    html[data-ios-app="true"] .gallery-page-header {
      position: relative;
      flex: 0 0 auto;
      padding-left: max(16px, env(safe-area-inset-left));
      padding-right: max(16px, env(safe-area-inset-right));
    }
    html[data-ios-app="true"] .gallery-page-body {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-left: max(16px, env(safe-area-inset-left));
      padding-right: max(16px, env(safe-area-inset-right));
    }
    html[data-ios-app="true"] .gallery-grid {
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    }
    html[data-ios-app="true"] .gallery-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 8px;
      justify-content: space-evenly;
    }
    html[data-ios-app="true"] .gallery-ibtn {
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      aspect-ratio: auto;
    }
    /* In the app the icons are Apple's own, handed over by the shell as --ios-icon-* */
    html[data-ios-app="true"] .gallery-ibtn svg {
      display: none;
    }
    html[data-ios-app="true"] .gallery-ibtn {
      border: 0;
    }
    html[data-ios-app="true"] .gallery-ibtn::before {
      content: '';
      width: var(--icon-size, 28px);
      height: var(--icon-size, 28px);
      background: currentColor;
      -webkit-mask: var(--icon) center / contain no-repeat;
      mask: var(--icon) center / contain no-repeat;
    }
    html[data-ios-app="true"] .gallery-ibtn[data-icon="folder"] { --icon: var(--ios-icon-folder); }
    html[data-ios-app="true"] .gallery-ibtn[data-icon="edit"] { --icon: var(--ios-icon-edit); --icon-size: 32px; }
    html[data-ios-app="true"] .gallery-ibtn[data-icon="share"] { --icon: var(--ios-icon-share); }
    html[data-ios-app="true"] .gallery-ibtn[data-icon="play"] { --icon: var(--ios-icon-play); --icon-size: 26px; }
    html[data-ios-app="true"][data-gallery-orientation="landscape"] .gallery-grid {
      grid-template-columns: repeat(auto-fit, minmax(148px, 1fr));
    }
    html[data-ios-app="true"] .gallery-share-overlay {
      padding:
        max(16px, env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        max(16px, env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));
      box-sizing: border-box;
    }
  </style>
</head>

  <main class="gallery-page-body">
